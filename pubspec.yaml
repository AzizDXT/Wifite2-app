name: oneshot
description: A calm, professional Android wrapper UI for the OneShot WPS auditing tool.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  archive: ^3.6.1        # unzip the bundled payload at runtime
  path_provider: ^2.1.3  # app private storage path

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # Generated by scripts/prepare_assets.sh (OneShot + arm64 binaries, zipped).
    - assets/payload.zip

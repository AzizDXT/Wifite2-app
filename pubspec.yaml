name: oneshot
description: A calm, professional Android wrapper UI for the OneShot WPS auditing tool.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  archive: ^3.6.1            # unzip the downloaded payload
  http: ^1.2.2               # download payload.zip at runtime
  path_provider: ^2.1.3      # app private storage path
  shared_preferences: ^2.2.3 # persist user settings

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # No bundled assets — the payload is downloaded at runtime (small APK).
